<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table 6.4: Mutation Rate Sensitivity</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: #070a14; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 50%), linear-gradient(180deg, #070a14 0%, #0d1220 50%, #070a14 100%); z-index: 0; }
        .bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .container { position: relative; z-index: 1; max-width: 900px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: #00d4ff; text-shadow: 0 0 30px rgba(0, 212, 255, 0.5); letter-spacing: 4px; }
        .content-box { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(7, 10, 20, 0.95) 100%); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .table-title { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #00d4ff; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; }
        .data-table th { background: rgba(0, 212, 255, 0.15); color: #00d4ff; font-family: 'Orbitron', sans-serif; font-size: 12px; padding: 12px; text-align: center; }
        .data-table td { background: rgba(0, 0, 0, 0.4); color: #c0c8d8; font-size: 13px; padding: 10px; text-align: center; border-top: 1px solid rgba(0, 212, 255, 0.08); }
        .highlight { color: #00e676; font-weight: 600; }
        .optimal { background: rgba(0, 230, 118, 0.15) !important; }
        .footer { text-align: center; margin-top: 25px; color: #5a6a8a; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="header"><h1>TABLE 6.4</h1></div>
        <div class="content-box">
            <div class="table-title">MUTATION RATE SENSITIVITY ANALYSIS</div>
            <table class="data-table">
                <thead><tr><th>Mutation Rate</th><th>Avg Fitness</th><th>Best Fitness</th><th>Success Rate</th><th>Convergence Gen</th><th>Time (ms)</th></tr></thead>
                <tbody>
                    <tr><td>0.001</td><td>88.5</td><td>94.2</td><td>62%</td><td>320</td><td>15230</td></tr>
                    <tr><td>0.01</td><td>95.3</td><td>101.5</td><td>78%</td><td>185</td><td>12840</td></tr>
                    <tr class="optimal"><td>0.05</td><td class="highlight">98.7</td><td class="highlight">108.2</td><td class="highlight">92%</td><td class="highlight">142</td><td>11250</td></tr>
                    <tr><td>0.10</td><td>96.2</td><td>105.8</td><td>85%</td><td>168</td><td>11980</td></tr>
                    <tr><td>0.20</td><td>92.1</td><td>99.5</td><td>72%</td><td>210</td><td>13560</td></tr>
                    <tr><td>0.30</td><td>85.8</td><td>93.7</td><td>58%</td><td>280</td><td>14890</td></tr>
                </tbody>
            </table>
        </div>
        <div class="footer">Course Scheduling System</div>
    </div>
</body>
</html>
