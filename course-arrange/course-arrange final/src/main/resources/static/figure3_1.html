<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Figure 3.1: Fitness Function Structure</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: #070a14; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 50%), linear-gradient(180deg, #070a14 0%, #0d1220 50%, #070a14 100%); z-index: 0; }
        .bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .container { position: relative; z-index: 1; max-width: 900px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: #00d4ff; text-shadow: 0 0 30px rgba(0, 212, 255, 0.5); letter-spacing: 4px; }
        .content-box { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(7, 10, 20, 0.95) 100%); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .figure-title { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #00d4ff; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .chart-box { width: 100%; height: 450px; }
        .footer { text-align: center; margin-top: 25px; color: #5a6a8a; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="header"><h1>FIGURE 3.1</h1></div>
        <div class="content-box">
            <div class="figure-title">FITNESS FUNCTION STRUCTURE</div>
            <div class="chart-box" id="chart"></div>
        </div>
        <div class="footer">Course Scheduling System - Mathematical Model</div>
    </div>
    <script>
        new Vue({
            el: '#chart',
            mounted() {
                const chart = echarts.init(this.$el);
                const option = {
                    tooltip: { trigger: 'item' },
                    series: [
                        {
                            type: 'treemap',
                            width: '90%',
                            height: '85%',
                            breadcrumb: { show: false },
                            label: { show: true, formatter: '{b}', fontSize: 14, fontFamily: 'Rajdhani', color: '#fff' },
                            itemStyle: { borderColor: '#070a14', borderWidth: 2, gapWidth: 2 },
                            levels: [
                                { itemStyle: { borderColor: '#00d4ff', borderWidth: 0, gapWidth: 5 } },
                                { colorSaturation: [0.3, 0.6], itemStyle: { borderColorSaturation: 0.7, gapWidth: 2 } }
                            ],
                            data: [
                                {
                                    name: 'Fitness(x)',
                                    value: 100,
                                    itemStyle: { color: '#00d4ff' },
                                    children: [
                                        {
                                            name: 'Hard Constraints',
                                            value: 40,
                                            itemStyle: { color: '#f56c6c' },
                                            children: [
                                                { name: 'Class Time\nUniqueness', value: 10, itemStyle: { color: '#e57373' } },
                                                { name: 'Teacher Time\nUniqueness', value: 10, itemStyle: { color: '#ef5350' } },
                                                { name: 'Room Time\nUniqueness', value: 10, itemStyle: { color: '#f44336' } },
                                                { name: 'Capacity\nConstraint', value: 10, itemStyle: { color: '#d32f2f' } }
                                            ]
                                        },
                                        {
                                            name: 'Soft Constraints',
                                            value: 35,
                                            itemStyle: { color: '#00e676' },
                                            children: [
                                                { name: 'Teacher\nPreference', value: 10, itemStyle: { color: '#69f0ae' } },
                                                { name: 'Course\nConcentration', value: 8, itemStyle: { color: '#00e676' } },
                                                { name: 'Room\nBalance', value: 7, itemStyle: { color: '#00c853' } },
                                                { name: 'Day\nConcentration', value: 10, itemStyle: { color: '#00e676' } }
                                            ]
                                        },
                                        {
                                            name: 'Resource\nUtilization',
                                            value: 25,
                                            itemStyle: { color: '#7c4dff' },
                                            children: [
                                                { name: 'Room\nUtilization', value: 15, itemStyle: { color: '#b388ff' } },
                                                { name: 'Time Slot\nUtilization', value: 10, itemStyle: { color: '#651fff' } }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                    ]
                };
                chart.setOption(option);
            }
        });
    </script>
</body>
</html>
