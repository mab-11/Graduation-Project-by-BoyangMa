<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Management</title>
</head>
<body>
<div id="app">
    <!--Search Box-->
    <el-form :inline="true" :model="searchForm" class="demo-form-inline">
        <el-form-item label="Teacher Name：">
            <el-input v-model="searchForm.teacherName" placeholder="Fuzzy Search"></el-input>
        </el-form-item>

        <el-form-item>
            <el-button type="primary" @click="selectByCondition">Search</el-button>
        </el-form-item>
    </el-form>

    <!--Batch-->
    <el-row>
        <el-button type="danger" plain @click="deleteByIds">Batch Delete</el-button>
        <el-button type="primary" plain @click="addFormVisible = true">Add Teacher</el-button>
        <el-button type="primary" plain @click="selectTeacher">Bind Course</el-button>
    </el-row>

    <!--Table-->
    <el-table
            :data="tableData"
            style="width: 100%"
            @selection-change="handleSelectionChange"
    >
        <el-table-column
                type="selection"
                width="55">
        </el-table-column>
        <el-table-column
                prop="id"
                label="Employee ID"
                align="center">
        </el-table-column>
        <el-table-column
                prop="teacherName"
                label="Teacher Name"
                align="center">
        </el-table-column>
        <el-table-column
                prop="remark"
                label="Remark"
                align="center">
        </el-table-column>

        <el-table-column label="Operation" align="center">
            <template slot-scope="scope">
                <el-button
                        size="mini"
                        @click="handleEdit(scope.$index, scope.row)">Edit
                </el-button>
                <el-button
                        size="mini"
                        type="danger"
                        @click="handleDelete(scope.$index, scope.row)">Delete
                </el-button>
            </template>
        </el-table-column>

    </el-table>

    <!--Add Dialog-->
    <el-dialog title="Add Teacher" :visible.sync="addFormVisible" width="30%"
    >
        <el-form ref="form" :model="teacherForm" label-width="80px">
            <el-form-item label="Employee ID">
                <el-input v-model="teacherForm.id"></el-input>
            </el-form-item>
            <el-form-item label="Teacher Name">
                <el-input v-model="teacherForm.teacherName"></el-input>
            </el-form-item>
            <el-form-item label="Password">
                <el-input v-model="teacherForm.password"></el-input>
            </el-form-item>
            <el-form-item label="Remark">
                <el-input type="textarea" v-model="teacherForm.remark"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="addTeacher">Submit</el-button>
                <el-button @click="addFormVisible=false">Cancel</el-button>
            </el-form-item>
        </el-form>

    </el-dialog>

    <!--Edit Dialog   -->
    <el-dialog title="Edit Teacher" :visible.sync="updateFormVisible" width="30%"
    >
        <el-form ref="form" :model="teacherForm" label-width="80px">
            <el-form-item label="Employee ID">
                <el-input v-model="teacherForm.id"></el-input>
            </el-form-item>
            <el-form-item label="Teacher Name">
                <el-input v-model="teacherForm.teacherName"></el-input>
            </el-form-item>
            <el-form-item label="Password">
                <el-input v-model="teacherForm.password"></el-input>
            </el-form-item>
            <el-form-item label="Remark">
                <el-input type="textarea" v-model="teacherForm.remark"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="updateTeacher()">Submit</el-button>
                <el-button @click="updateFormVisible=false">Cancel</el-button>
            </el-form-item>
        </el-form>

    </el-dialog>

    <!--Pagination-->
    <div class="block">
        <el-pagination
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
                :current-page="currentPage"
                :page-sizes="[5, 10, 15, 20]"
                :page-size="pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="totalCount">
        </el-pagination>
    </div>

    <!--Course Binding Dialog-->
    <el-dialog title="Course Binding" :visible.sync="cTeacherFormVisible" width="70%">
        <!--Search Box-->
        <el-form :inline="true" :model="searchForm2" class="demo-form-inline">
            <el-form-item label="Course Code：">
                <el-input v-model="searchForm2.code" placeholder="Fuzzy Search"></el-input>
            </el-form-item>

            <el-form-item label="Course Name：">
                <el-input v-model="searchForm2.courseName" placeholder="Fuzzy Search"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="selectByCondition2">Search</el-button>
            </el-form-item>
        </el-form>
        <!--Course Table-->
        <el-table
                :data="tableData2"
                style="width: 100%"
                @selection-change="handleSelectionChange"
        >
            <el-table-column
                    prop="code"
                    label="Course Code"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="courseName"
                    label="Course Name"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="remark"
                    label="Remark"
                    align="center">
            </el-table-column>

            <el-table-column label="Operation" align="center">
                <template slot-scope="scope">
                    <el-button
                            size="mini"
                            type="primary"
                            @click="handleEdit2(scope.$index, scope.row)">Select
                    </el-button>
                </template>
            </el-table-column>
        </el-table>

        <!--Pagination-->
        <div class="block">
            <el-pagination
                    @size-change="handleSizeChange2"
                    @current-change="handleCurrentChange2"
                    :current-page="currentPage2"
                    :page-sizes="[3, 6, 9]"
                    :page-size="pageSize2"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="totalCount2">
            </el-pagination>
        </div>

        <!--Selected Result -->
        <el-form :inline="true" :model="cTeacherForm" class="demo-form-inline" style="margin-top: 20px">
            <el-form-item label="Teacher Name">
                <el-input v-model="selectTeacherName" :disabled="true" style="width:370px"></el-input>
            </el-form-item>

            <el-form-item label="Course Name">
                <el-input v-model="selectCourse.courseName" :disabled="true"></el-input>
            </el-form-item>
            <br>

            <el-form-item label="Remark：">
                <el-input v-model="selectRemark" style="width:370px"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="addCteacher">Submit</el-button>
            </el-form-item>

        </el-form>

    </el-dialog>


</div>


<!--Import Resources-->
<script src="js/vue.js"></script>
<script src="element-ui/lib/index.js"></script>
<link rel="stylesheet" href="element-ui/lib/theme-chalk/index.css">
<script src="js/axios-0.18.0.js"></script>


<script>
    //Create Vue core object
    new Vue({
        el: "#app",
        mounted() {
            this.selectByCondition();
            //Query course
            this.selectByCondition2();
        },
        methods: {

            //Edit  Delete
            handleEdit(index, row) {
                //Fill data using JSON to break model binding
                this.teacherForm = JSON.parse(JSON.stringify(row));
                this.oldId = JSON.parse(JSON.stringify(row.id));
                //Open edit form
                this.updateFormVisible = true;
            },

            handleDelete(index, row) {
                this.multipleSelection[0] = row;
                this.deleteByIds();
            },

            //Search
            selectByCondition() {
                var _this = this;
                axios({
                    method: "post",
                    url: "http://localhost:8080/teacher/selectByCondition?" +
                        "currentPage=" + _this.currentPage + "&pageSize=" + _this.pageSize,
                    data: this.searchForm
                }).then(function (resp) {
                    //Set table data
                    _this.tableData = resp.data.list;
                    _this.totalCount = resp.data.total;
                })
            },


            //Pagination
            handleSizeChange(val) {
                //Reset page size
                this.pageSize = val;
                //Search again
                this.selectByCondition();
            },
            handleCurrentChange(val) {
                this.currentPage = val;
                //Search again
                this.selectByCondition();
            },


            //Checkbox event
            handleSelectionChange(val) {
                this.multipleSelection = val;
            },

            //Batch delete
            deleteByIds() {
                var _this = this;
                //Not selected
                if (this.multipleSelection.length == 0) {
                    //Show message
                    _this.$message({
                        message: 'No selected items!',
                        type: 'error',
                        center: true
                    });
                } else {
                    this.$confirm('This operation will delete the teacher, continue?', "Prompt", {
                        confirmButtonText: "Confirm",
                        cancelButtonText: "Cancel",
                        type: "warning"
                    }).then(() => {
                        //User clicks confirm button
                        for (let i = 0; i < this.multipleSelection.length; i++) {
                            this.selectIds[i] = this.multipleSelection[i].id;
                        }

                        //Send ajax request
                        axios({
                            method: "post",
                            url: 'http://localhost:8080/teacher/deleteByIds',
                            data: _this.selectIds
                        }).then(function (resp) {
                            if (resp.data == "success") {
                                //Delete success, search again
                                _this.selectByCondition();
                                //Show message
                                _this.$message({
                                    message: 'Operation successful',
                                    type: 'success',
                                    center: true
                                });
                            }

                        })
                    })
                }
            },


            //Submit add form
            addTeacher() {
                var _this = this;
                axios({
                    method: "post",
                    url: "http://localhost:8080/teacher/add",
                    data: _this.teacherForm
                }).then(function (resp) {
                    //Close dialog
                    _this.addFormVisible = false;
                    if (resp.data == "success") {
                        //Search data again
                        _this.selectByCondition();
                        //Show message
                        _this.$message({
                            message: 'Add success',
                            type: 'success',
                            center: true
                        });
                    } else {
                        _this.$message({
                            message: 'Employee ID already exists!',
                            type: 'error',
                            center: true,
                        });
                    }
                })
            },

            //Submit update form
            updateTeacher() {
                var _this = this;
                //Check if ID is modified
                var flag = null;
                if (this.oldId != this.teacherForm.id) {
                    //Return old ID
                    flag = this.oldId;
                }
                axios({
                    method: "post",
                    url: "http://localhost:8080/teacher/update?flag=" + flag,
                    data: _this.teacherForm
                }).then(function (resp) {
                    if (resp.data == "success") {
                        //Close dialog
                        _this.updateFormVisible = false;
                        //Search data again
                        _this.selectByCondition();
                        //Show message
                        _this.$message({
                            message: 'Update success',
                            type: 'success',
                            center: true
                        });
                    } else {
                        //Close dialog
                        _this.updateFormVisible = false;
                        //Show message
                        _this.$message({
                            message: 'Employee ID already exists!',
                            type: 'error',
                            center: true
                        });
                    }
                })
            },


            //Course Binding multiple teachers
            selectTeacher() {
                var _this = this;
                //Not selected
                if (this.multipleSelection.length == 0) {
                    //Show message
                    _this.$message({
                        message: 'No selected items!',
                        type: 'error',
                        center: true
                    });
                }else {
                    this.selectTeacherName = '';
                    for (let i = 0; i < this.multipleSelection.length; i++) {
                        this.cTeacherForm[i] = JSON.parse(JSON.stringify(this.cTeacher)) ;
                        this.cTeacherForm[i].teacher = this.multipleSelection[i];
                        this.selectTeacherName += this.multipleSelection[i].teacherName + ',';
                    }
                    this.cTeacherFormVisible = true;
                }

            },

            addCteacher() {
                var _this = this;
                for (let i = 0; i < this.cTeacherForm.length; i++) {
                    this.cTeacherForm[i].course = this.selectCourse;
                    this.cTeacherForm[i].remark = this.selectRemark;
                }
                //Send add request
                axios({
                    method: "post",
                    url: "http://localhost:8080/cteacher/add",
                    data: _this.cTeacherForm
                }).then(function (resp) {
                    //Close dialog
                    _this.cTeacherFormVisible = false;
                    if (resp.data == "success") {
                        //Search data again
                        _this.selectByCondition();
                        //Show message
                        _this.$message({
                            message: 'Add success',
                            type: 'success',
                            center: true
                        });
                    } else {
                        _this.$message({
                            message: 'Course Binding already exists!',
                            type: 'error',
                            center: true,
                        });
                    }
                })
            },

            //Select Edit
            handleEdit2(index, row) {
                //Fill data using JSON to break model binding
                this.selectCourse = JSON.parse(JSON.stringify(row));
            },
            //Course Search
            selectByCondition2() {
                var _this = this;
                axios({
                    method: "post",
                    url: "http://localhost:8080/course/selectByCondition?" +
                        "currentPage=" + _this.currentPage2 + "&pageSize=" + _this.pageSize2,
                    data: this.searchForm2
                }).then(function (resp) {
                    //Set table data
                    _this.tableData2 = resp.data.list;
                    _this.totalCount2 = resp.data.total;
                })
            },
            //Course pagination
            handleSizeChange2(val) {
                //Reset page size
                this.pageSize2 = val;
                //Search again
                this.selectByCondition2();
            },
            handleCurrentChange2(val) {
                this.currentPage2 = val;
                //Search again
                this.selectByCondition2();
            },


        },


        //Data
        data() {
            return {
                //Pagination
                //Current page
                currentPage: 1,
                //Total pages
                totalCount: 0,
                //Current item count
                pageSize: 5,


                //Selected array
                selectIds: [],

                //Add visible
                addFormVisible: false,
                //Update visible
                updateFormVisible: false,
                searchForm: {
                    teacherName: ''
                },

                oldId: '',
                //Add form
                teacherForm: {
                    id: '',
                    teacherName: '',
                    remark: '',
                    password:''
                },

                //Checkbox value?
                multipleSelection: [],

                //Table data
                tableData: [],


                //Add form
                cTeacherForm: [],
                cTeacher: {
                    id: '',
                    teacher: [],
                    course: {},
                    remark: ''
                },
                selectTeacherName: '',
                selectCourse: {},
                selectRemark: '',
                cTeacherFormVisible: false,
                //Assign course
                //Current page
                currentPage2: 1,
                //Total pages
                totalCount2: 0,
                //Current item count
                pageSize2: 3,
                //Search form
                searchForm2: {
                    code: '',
                    courseName: ''
                },
                tableData2: [],

            }
        }
    })

</script>


</body>
</html>
