<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 6.1: Convergence Curves Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: #070a14; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 50%), radial-gradient(ellipse at 85% 85%, rgba(255, 87, 34, 0.06) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(88, 101, 242, 0.05) 0%, transparent 60%), linear-gradient(180deg, #070a14 0%, #0d1220 50%, #070a14 100%); z-index: 0; }
        .bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .container { position: relative; z-index: 1; max-width: 900px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: #00d4ff; text-shadow: 0 0 30px rgba(0, 212, 255, 0.5); letter-spacing: 4px; margin-bottom: 10px; }
        .header .subtitle { font-size: 18px; color: #5a6a8a; letter-spacing: 2px; }
        .content-box { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(7, 10, 20, 0.95) 100%); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .figure-title { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #00d4ff; text-align: center; margin-bottom: 20px; text-shadow: 0 0 20px rgba(0, 212, 255, 0.4); letter-spacing: 2px; }
        .chart-area { height: 320px; background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 15px; border: 1px solid rgba(0, 212, 255, 0.1); }
        .legend { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8ba4c7; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .footer { text-align: center; margin-top: 25px; color: #5a6a8a; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="header"><h1>FIGURE 6.1</h1><p class="subtitle">Convergence Curves Comparison</p></div>
        <div class="content-box">
            <div class="figure-title">FITNESS CONVERGENCE OVER GENERATIONS</div>
            <div class="chart-area" id="chart"></div>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot" style="background:#00d4ff;"></div>AMOGA (Proposed)</div>
                <div class="legend-item"><div class="legend-dot" style="background:#ff9800;"></div>Fixed GA</div>
                <div class="legend-item"><div class="legend-dot" style="background:#7c4dff;"></div>SA</div>
                <div class="legend-item"><div class="legend-dot" style="background:#00e676;"></div>ACO</div>
            </div>
        </div>
        <div class="footer">Course Scheduling System - University Timetabling Optimization</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        const chart = echarts.init(document.getElementById('chart'));
        const option = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis', backgroundColor: 'rgba(7,10,20,0.95)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
            xAxis: { type: 'category', data: [0,20,40,60,80,100,120,140,160,180,200], name: 'Generation', axisLine: { lineStyle: { color: 'rgba(0,212,255,0.3)' } }, axisLabel: { color: '#8ba4c7' } },
            yAxis: { type: 'value', name: 'Fitness', axisLine: { lineStyle: { color: 'rgba(0,212,255,0.3)' } }, axisLabel: { color: '#8ba4c7' }, splitLine: { lineStyle: { color: 'rgba(0,212,255,0.1)' } } },
            series: [
                { name: 'AMOGA', type: 'line', data: [10,35,58,82,98,112,118,122,124,125,125], smooth: true, symbol: 'circle', symbolSize: 6, itemStyle: { color: '#00d4ff' }, lineStyle: { width: 3 }, areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(0,212,255,0.3)' }, { offset: 1, color: 'rgba(0,212,255,0)' }] } } },
                { name: 'Fixed GA', type: 'line', data: [10,28,45,60,75,88,98,105,112,118,122], smooth: true, symbol: 'diamond', symbolSize: 5, itemStyle: { color: '#ff9800' }, lineStyle: { width: 2, type: 'dashed' } },
                { name: 'SA', type: 'line', data: [10,22,35,48,60,72,82,90,96,100,103], smooth: true, symbol: 'triangle', symbolSize: 5, itemStyle: { color: '#7c4dff' }, lineStyle: { width: 2 } },
                { name: 'ACO', type: 'line', data: [10,30,50,68,84,98,108,115,120,123,125], smooth: true, symbol: 'square', symbolSize: 5, itemStyle: { color: '#00e676' }, lineStyle: { width: 2 } }
            ]
        };
        chart.setOption(option);
    </script>
</body>
</html>
