<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Figure 6.5: Scalability Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: #070a14; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 50%), linear-gradient(180deg, #070a14 0%, #0d1220 50%, #070a14 100%); z-index: 0; }
        .bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .container { position: relative; z-index: 1; max-width: 900px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: #00d4ff; text-shadow: 0 0 30px rgba(0, 212, 255, 0.5); letter-spacing: 4px; }
        .content-box { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(7, 10, 20, 0.95) 100%); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .figure-title { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #00d4ff; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .chart-box { width: 100%; height: 400px; }
        .footer { text-align: center; margin-top: 25px; color: #5a6a8a; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="header"><h1>FIGURE 6.5</h1></div>
        <div class="content-box">
            <div class="figure-title">SCALABILITY ANALYSIS</div>
            <div class="chart-box" id="chart"></div>
        </div>
        <div class="footer">Course Scheduling System - Experiment Analysis</div>
    </div>
    <script>
        new Vue({
            el: '#chart',
            mounted() {
                const chart = echarts.init(this.$el);
                const option = {
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['AMOGA', 'Fixed GA', 'Simulated Annealing', 'PSO'], textStyle: { color: '#8ba4c7' }, top: 10 },
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: { type: 'category', data: ['30', '80', '150', '300', '500'], axisLabel: { color: '#8ba4c7' }, name: 'Problem Size (Tasks)', nameLocation: 'middle', nameGap: 25 },
                    yAxis: [
                        { type: 'value', axisLabel: { color: '#8ba4c7' }, name: 'Execution Time (ms)', nameLocation: 'middle', nameGap: 40, position: 'left' },
                        { type: 'value', axisLabel: { color: '#8ba4c7' }, name: 'Success Rate (%)', nameLocation: 'middle', nameGap: 40, position: 'right' }
                    ],
                    series: [
                        { name: 'AMOGA', type: 'line', yAxisIndex: 0, data: [1250, 3800, 8900, 18500, 32000], smooth: true, itemStyle: { color: '#00e676' }, areaStyle: { opacity: 0.1 } },
                        { name: 'Fixed GA', type: 'line', yAxisIndex: 0, data: [1800, 5200, 12500, 28000, 48000], smooth: true, itemStyle: { color: '#00d4ff' } },
                        { name: 'Simulated Annealing', type: 'line', yAxisIndex: 0, data: [2200, 6800, 16000, 35000, 62000], smooth: true, itemStyle: { color: '#7c4dff' } },
                        { name: 'PSO', type: 'line', yAxisIndex: 0, data: [1950, 5800, 14000, 31000, 55000], smooth: true, itemStyle: { color: '#ff9800' } },
                        { name: 'AMOGA-SR', type: 'line', yAxisIndex: 1, data: [98, 97, 96, 94, 91], smooth: true, itemStyle: { color: '#00e676' }, lineStyle: { type: 'dashed' }, symbol: 'triangle' },
                        { name: 'Fixed GA-SR', type: 'line', yAxisIndex: 1, data: [95, 93, 90, 85, 78], smooth: true, itemStyle: { color: '#00d4ff' }, lineStyle: { type: 'dashed' }, symbol: 'triangle' }
                    ]
                };
                chart.setOption(option);
            }
        });
    </script>
</body>
</html>
