<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedule Management</title>
</head>
<body>
<div id="app">
    <!--Search Box-->
    <el-form :inline="true" :model="searchForm" class="demo-form-inline">
        <el-form-item label="Class Name：">
            <el-input v-model="searchForm.task.cclasses.classesName" placeholder="Fuzzy Search" style="width: 100px"></el-input>
        </el-form-item>
        <el-form-item label="Course Name：">
            <el-input v-model="searchForm.task.cclasses.course.courseName" placeholder="Fuzzy Search"
                      style="width: 100px"></el-input>
        </el-form-item>
        <el-form-item label="Teacher Name：">
            <el-input v-model="searchForm.task.teacher.teacherName" placeholder="Fuzzy Search" style="width: 100px"></el-input>
        </el-form-item>
        <el-form-item label="Room Name：">
            <el-input v-model="searchForm.room.roomName" placeholder="Fuzzy Search" style="width: 100px"></el-input>
        </el-form-item>

        <el-form-item label="Time：">
            <el-select v-model="week" clearable placeholder="Select Weekday" style="width:130px">
                <el-option
                        clearable
                        v-for="item in options1"
                        :key="item.id"
                        :label="item.weekName"
                        :value="item.id">
                </el-option>
            </el-select>
            <el-select v-model="time" clearable placeholder="Select Period" style="width:130px">
                <el-option
                        clearable
                        v-for="item in options2"
                        :key="item.id"
                        :label="item.timeName"
                        :value="item.id">
                </el-option>
            </el-select>
        </el-form-item>


        <el-form-item>
            <el-button type="primary" @click="selectByCondition">Search</el-button>
        </el-form-item>
    </el-form>

    <!--Batch-->
    <el-row>
        <el-button type="danger" plain @click="deleteByIds">Batch Delete</el-button>
        <el-button type="primary" plain @click="selectTask">Manual Schedule</el-button>
        <el-button style="margin-left: 920px" type="primary" plain @click="reArrangeCourse">Auto Schedule</el-button>
    </el-row>

    <!--    Table-->
    <el-table
            v-loading="loading"
            :data="tableData"
            stripe
            style="width: 100%"
            @selection-change="handleSelectionChange"
    >
        <el-table-column
                type="selection"
                width="55">
        </el-table-column>
        <el-table-column
                fixed
                width="40px"
                prop="task.id"
                label="ID"
                align="center">
        </el-table-column>
        <el-table-column
                fixed
                prop="task.cclasses.classesName"
                label="Class Name"
                align="center">
        </el-table-column>
        <el-table-column
                fixed
                prop="task.cclasses.course.courseName"
                label="Course Name"
                align="center">
        </el-table-column>
        <el-table-column
                fixed
                prop="task.teacher.teacherName"
                label="Teacher Name"
                align="center">
        </el-table-column>
        <el-table-column
                fixed
                prop="room.roomName"
                label="Room Name"
                align="center">
        </el-table-column>
        <el-table-column
                fixed
                width="80px"
                prop="timeslot.timeslot"
                label="Time"
                align="center">
        </el-table-column>
        <el-table-column
                fixed
                width="60px"
                prop="task.weekNode"
                label="Week Period"
                align="center">
        </el-table-column>
        <el-table-column
                width="80px"
                prop="task.startWeek"
                label="Start Week"
                align="center">
        </el-table-column>
        <el-table-column
                width="80px"
                prop="task.endWeek"
                label="End Week"
                align="center">
        </el-table-column>

        <el-table-column label="Operation" align="center" fixed="right">
            <template slot-scope="scope">
                <el-button
                        size="mini"
                        @click="handleEdit(scope.$index, scope.row)">Adjust
                </el-button>
                <el-button
                        size="mini"
                        type="danger"
                        @click="handleDelete(scope.$index, scope.row)">Delete
                </el-button>
            </template>
        </el-table-column>

    </el-table>

    <!--Add Dialog  1 -->
    <el-dialog title="Manual Schedule" :visible.sync="addFormVisible" width="80%">
        <!--Search Box-->
        <el-form :inline="true" :model="searchForm3" class="demo-form-inline">
            <el-form-item label="Class Name：">
                <el-input v-model="searchForm3.cclasses.classesName" placeholder="Fuzzy Search"></el-input>
            </el-form-item>
            <el-form-item label="Course Name：">
                <el-input v-model="searchForm3.cclasses.course.courseName" placeholder="Fuzzy Search"></el-input>
            </el-form-item>
            <el-form-item label="Teacher Name：">
                <el-input v-model="searchForm3.teacher.teacherName" placeholder="Fuzzy Search"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="selectTask">Search</el-button>
            </el-form-item>
        </el-form>

        <!--    Table-->
        <el-table
                :data="tableData3"
                style="width: 100%"
        >

            <el-table-column
                    prop="id"
                    label="ID"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="cclasses.classesName"
                    label="Class Name"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="cclasses.course.courseName"
                    label="Course Name"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="teacher.teacherName"
                    label="Teacher Name"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="weekNode"
                    label="Week Period"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="startWeek"
                    label="Start Week"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="endWeek"
                    label="End Week"
                    align="center">
            </el-table-column>

            <el-table-column label="Operation" align="center">
                <template slot-scope="scope">
                    <el-button
                            size="mini"
                            @click="handleEdit3(scope.$index, scope.row)">Select
                    </el-button>
                </template>
            </el-table-column>

        </el-table>

        <!--Pagination-->
        <div class="block">
            <el-pagination
                    @size-change="handleSizeChange3"
                    @current-change="handleCurrentChange3"
                    :current-page="currentPage3"
                    :page-sizes="[3, 5, 9]"
                    :page-size="pageSize3"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="totalCount3">
            </el-pagination>
        </div>

        <!--Selected Result -->
        <el-form :inline="true" :model="courseTableForm" class="demo-form-inline" style="margin-top: 20px">
            <el-form-item label="Class Name">
                <el-input v-model="courseTableForm.task.cclasses.classesName" :disabled="true"></el-input>
            </el-form-item>

            <el-form-item label="Course Name">
                <el-input v-model="courseTableForm.task.cclasses.course.courseName" style="width:100px"
                          :disabled="true"></el-input>
            </el-form-item>

            <el-form-item label="Teacher Name">
                <el-input v-model="courseTableForm.task.teacher.teacherName" style="width:100px"
                          :disabled="true"></el-input>
            </el-form-item>
            <el-form-item label="Week Period">
                <el-input v-model="courseTableForm.task.weekNode" style="width:100px" :disabled="true"></el-input>
            </el-form-item>


            <el-form-item>
                <el-button type="primary" @click="choseTask">Manual Schedule</el-button>
            </el-form-item>

        </el-form>

    </el-dialog>

    <!--Add Dialog 2  -->
    <el-dialog title="Empty Room Selection" :visible.sync="addFormVisible2" width="70%">
        <!--Search Box-->
        <el-form :inline="true" :model="searchForm2" class="demo-form-inline">
            <el-form-item label="Room Name：">
                <el-input v-model="searchForm2.room.roomName" placeholder="Fuzzy Search"></el-input>
            </el-form-item>
            <el-form-item label="Time：">
                <el-select v-model="week2" clearable placeholder="Select Weekday" style="width:130px">
                    <el-option
                            clearable
                            v-for="item in options1"
                            :key="item.id"
                            :label="item.weekName"
                            :value="item.id">
                    </el-option>
                </el-select>
                <el-select v-model="time2" clearable placeholder="Select Period" style="width:130px">
                    <el-option
                            clearable
                            v-for="item in options2"
                            :key="item.id"
                            :label="item.timeName"
                            :value="item.id">
                    </el-option>
                </el-select>
            </el-form-item>


            <el-form-item>
                <el-button type="primary" @click="selectEmptyRoom">Search Empty Room</el-button>
            </el-form-item>
        </el-form>

        <!--    Table-->
        <el-table
                :data="tableData2"
                stripe
                style="width: 100%"
        >

            <el-table-column
                    fixed
                    width="40px"
                    type="index"
                    label="ID"
                    align="center">
            </el-table-column>
            <el-table-column
                    fixed
                    prop="room.roomName"
                    label="Room Name"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="room.capacity"
                    label="Capacity"
                    align="center">
            </el-table-column>
            <el-table-column
                    fixed
                    width="80px"
                    prop="timeslot.timeslot"
                    label="Time"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="room.remark"
                    label="Remark"
                    align="center">
            </el-table-column>


            <el-table-column label="Operation" align="center" fixed="right">
                <template slot-scope="scope">
                    <el-button
                            type="primary"
                            size="mini"
                            @click="handleEdit2(scope.$index, scope.row)">Select
                    </el-button>
                </template>
            </el-table-column>

        </el-table>

        <!--Pagination-->
        <div class="block">
            <el-pagination
                    @size-change="handleSizeChange2"
                    @current-change="handleCurrentChange2"
                    :current-page="currentPage2"
                    :page-sizes="[3, 5, 9]"
                    :page-size="pageSize2"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="totalCount2">
            </el-pagination>
        </div>

        <!--Selected Result -->
        <el-form :inline="true" :model="courseTableForm" class="demo-form-inline" style="margin-top: 20px">
            <el-form-item label="Room Name">
                <el-input v-model="courseTableForm.room.roomName" :disabled="true"></el-input>
            </el-form-item>

            <el-form-item label="Time">
                <el-input v-model="courseTableForm.timeslot.timeslot" :disabled="true"></el-input>
            </el-form-item>


            <el-form-item>
                <el-button type="primary" @click="addCourseTable">Submit</el-button>
            </el-form-item>

        </el-form>

    </el-dialog>


    <!--Edit Dialog   -->
    <el-dialog title="Adjust Schedule" :visible.sync="updateFormVisible" width="70%">
        <!--Search Box-->
        <el-form :inline="true" :model="searchForm2" class="demo-form-inline">
            <el-form-item label="Room Name：">
                <el-input v-model="searchForm2.room.roomName" placeholder="Fuzzy Search"></el-input>
            </el-form-item>
            <el-form-item label="Time：">
                <el-select v-model="week2" clearable placeholder="Select Weekday" style="width:130px">
                    <el-option
                            clearable
                            v-for="item in options1"
                            :key="item.id"
                            :label="item.weekName"
                            :value="item.id">
                    </el-option>
                </el-select>
                <el-select v-model="time2" clearable placeholder="Select Period" style="width:130px">
                    <el-option
                            clearable
                            v-for="item in options2"
                            :key="item.id"
                            :label="item.timeName"
                            :value="item.id">
                    </el-option>
                </el-select>
            </el-form-item>


            <el-form-item>
                <el-button type="primary" @click="selectEmptyRoom">Search Empty Room</el-button>
            </el-form-item>
        </el-form>

        <!--    Table-->
        <el-table
                :data="tableData2"
                stripe
                style="width: 100%"
                @selection-change="handleSelectionChange"
        >

            <el-table-column
                    fixed
                    width="40px"
                    type="index"
                    label="ID"
                    align="center">
            </el-table-column>
            <el-table-column
                    fixed
                    prop="room.roomName"
                    label="Room Name"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="room.capacity"
                    label="Capacity"
                    align="center">
            </el-table-column>
            <el-table-column
                    fixed
                    width="80px"
                    prop="timeslot.timeslot"
                    label="Time"
                    align="center">
            </el-table-column>
            <el-table-column
                    prop="room.remark"
                    label="Remark"
                    align="center">
            </el-table-column>


            <el-table-column label="Operation" align="center" fixed="right">
                <template slot-scope="scope">
                    <el-button
                            type="primary"
                            size="mini"
                            @click="handleEdit2(scope.$index, scope.row)">Select
                    </el-button>
                </template>
            </el-table-column>

        </el-table>

        <!--Pagination-->
        <div class="block">
            <el-pagination
                    @size-change="handleSizeChange2"
                    @current-change="handleCurrentChange2"
                    :current-page="currentPage2"
                    :page-sizes="[3, 5, 9]"
                    :page-size="pageSize2"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="totalCount2">
            </el-pagination>
        </div>

        <!--Selected Result -->
        <el-form :inline="true" :model="courseTableForm" class="demo-form-inline" style="margin-top: 20px">
            <el-form-item label="Room Name">
                <el-input v-model="courseTableForm.room.roomName" :disabled="true"></el-input>
            </el-form-item>

            <el-form-item label="Time">
                <el-input v-model="courseTableForm.timeslot.timeslot" :disabled="true"></el-input>
            </el-form-item>


            <el-form-item>
                <el-button type="primary" @click="updateCourseTable">Submit</el-button>
            </el-form-item>

        </el-form>

    </el-dialog>


    <!--Pagination-->
    <div class="block">
        <el-pagination
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
                :current-page="currentPage"
                :page-sizes="[5, 10, 15, 20]"
                :page-size="pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="totalCount">
        </el-pagination>
    </div>

</div>


<!--Import Resources-->
<script src="js/vue.js"></script>
<script src="element-ui/lib/index.js"></script>
<link rel="stylesheet" href="element-ui/lib/theme-chalk/index.css">
<script src="js/axios-0.18.0.js"></script>


<script>
    //Create Vue core object
    new Vue({
        el: "#app",
        mounted() {
            this.selectByCondition();
        },
        methods: {

            //Edit Delete
            handleEdit(index, row) {
                //Fill data using JSON to break model binding
                this.courseTableForm = JSON.parse(JSON.stringify(row));
                this.selectEmptyRoom();
                //Open edit form
                this.updateFormVisible = true;
            },

            handleDelete(index, row) {
                let selection = [];
                selection[0] = row;
                this.multipleSelection = selection;
                this.deleteByIds();
            },

            //Search
            selectByCondition() {
                this.searchForm.timeslot.id = this.week + this.time;
                var _this = this;
                axios({
                    method: "post",
                    url: "http://localhost:8080/courseTable/selectByCondition?" +
                        "currentPage=" + _this.currentPage + "&pageSize=" + _this.pageSize,
                    data: this.searchForm
                }).then(function (resp) {
                    //Set table data
                    _this.tableData = resp.data.list;
                    _this.totalCount = resp.data.total;
                })
            },

            //Auto Schedule again
            reArrangeCourse() {
                var _this = this;
                //Not selected
                this.$confirm('This operation will delete the previous schedule result, continue?', "Prompt", {
                    confirmButtonText: "Confirm",
                    cancelButtonText: "Cancel",
                    type: "warning"
                }).then(() => {
                    //Loading animation
                    _this.loading = true;
                    //Send ajax request
                    axios({
                        method: "post",
                        url: 'http://localhost:8080/courseTable/reArrangeCourse',
                    }).then(function (resp) {
                        _this.loading = false;
                        if (resp.data == "success") {
                            //Schedule success, searching again
                            _this.selectByCondition();
                            //Show message
                            _this.$message({
                                message: 'Schedule success',
                                type: 'success',
                                center: true
                            });
                        } else {
                            //Show message
                            _this.$message({
                                message: 'Schedule failed, please check log!',
                                type: 'error',
                                center: true
                            });
                        }

                    })
                })

            },


            //Pagination
            handleSizeChange(val) {
                //Reset page size
                this.pageSize = val;
                //Search again
                this.selectByCondition();
            },
            handleCurrentChange(val) {
                this.currentPage = val;
                //Search again
                this.selectByCondition();
            },


            //Selection change event
            handleSelectionChange(val) {
                this.multipleSelection = val;
            },

            //Batch delete
            deleteByIds() {
                var _this = this;
                //Not selected
                if (this.multipleSelection.length == 0) {
                    //Show message
                    _this.$message({
                        message: 'No selected items!',
                        type: 'error',
                        center: true
                    });
                } else {
                    this.$confirm('This operation will delete the schedule result, continue?', "Prompt", {
                        confirmButtonText: "Confirm",
                        cancelButtonText: "Cancel",
                        type: "warning"
                    }).then(() => {
                        //User clicked confirm button
                        for (let i = 0; i < this.multipleSelection.length; i++) {
                            this.selectIds[i] = this.multipleSelection[i].task.id;
                        }
                        //Send ajax request
                        axios({
                            method: "post",
                            url: 'http://localhost:8080/courseTable/deleteByIds',
                            data: _this.selectIds
                        }).then(function (resp) {
                            if (resp.data == "success") {
                                //Delete successful, searching again
                                _this.selectByCondition();
                                //Show message
                                _this.$message({
                                    message: 'Operation successful',
                                    type: 'success',
                                    center: true
                                });
                            }

                        })
                    })
                }

            },


            //Submit update form
            updateCourseTable() {
                var _this = this;
                this.$confirm('This operation will adjust the schedule result, continue?', "Prompt", {
                    confirmButtonText: "Confirm",
                    cancelButtonText: "Cancel",
                    type: "warning"
                }).then(() => {
                    //Send ajax request
                    axios({
                        method: "post",
                        url: 'http://localhost:8080/courseTable/update',
                        data: _this.courseTableForm
                    }).then(function (resp) {
                        if (resp.data == "success") {
                            _this.updateFormVisible = false;
                            //Delete successful, searching again
                            _this.selectByCondition();
                            //Show message
                            _this.$message({
                                message: 'Operation successful',
                                type: 'success',
                                center: true
                            });
                        } else {
                            _this.$message({
                                message: resp.data,
                                type: 'error',
                                center: true
                            });
                        }

                    })
                })

            },


            //Course search
            selectEmptyRoom() {

                //Search empty rooms with sufficient capacity
                this.searchForm2.task.cclasses.size = JSON.parse(JSON.stringify(this.courseTableForm.task.cclasses.size));
                this.searchForm2.timeslot.id = this.week2 + this.time2;
                var _this = this;
                axios({
                    method: "post",
                    url: "http://localhost:8080/courseTable/selectEmptyRoom?" +
                        "currentPage=" + _this.currentPage2 + "&pageSize=" + _this.pageSize2,
                    data: this.searchForm2
                }).then(function (resp) {
                    //Set table data
                    _this.tableData2 = resp.data.list;
                    _this.totalCount2 = resp.data.total;
                })
            },
            //Select edit
            handleEdit2(index, row) {
                //Fill data using JSON to break model binding
                this.courseTableForm.timeslot = JSON.parse(JSON.stringify(row)).timeslot;
                this.courseTableForm.room = JSON.parse(JSON.stringify(row)).room;
            },
            //Course pagination
            handleSizeChange2(val) {
                //Reset page size
                this.pageSize2 = val;
                //Search again
                this.selectEmptyRoom();
            },
            handleCurrentChange2(val) {
                this.currentPage2 = val;
                //Search again
                this.selectEmptyRoom();
            },

            //Add
            addCourseTable() {
                var _this = this;
                axios({
                    method: "post",
                    url: 'http://localhost:8080/courseTable/add',
                    data: _this.courseTableForm
                }).then(function (resp) {
                    if (resp.data == "success") {
                        _this.addFormVisible2 = false;
                        //Delete successful, searching again
                        _this.selectByCondition();
                        //Show message
                        _this.$message({
                            message: 'Operation successful',
                            type: 'success',
                            center: true
                        });
                    } else {
                        _this.$message({
                            message: resp.data,
                            type: 'error',
                            center: true
                        });
                    }

                })

            },

            //Manual Schedule
            arrangeCourse() {


            },
            //Search unassigned tasks
            selectTask() {
                //Add form
                this.addFormVisible = true;
                //Search all unassigned teaching tasks
                var _this = this;
                axios({
                    method: "post",
                    url: "http://localhost:8080/courseTable/selectTask?" +
                        "currentPage=" + _this.currentPage3 + "&pageSize=" + _this.pageSize3,
                    data: this.searchForm3
                }).then(function (resp) {
                    //Set table data
                    _this.tableData3 = resp.data.list;
                    _this.totalCount3 = resp.data.total;
                })
            },
            //Select task
            choseTask() {
                this.addFormVisible = false;
                console.log(this.courseTableForm);
                this.selectEmptyRoom();
                this.addFormVisible2 = true;
            },
            //Select edit
            handleEdit3(index, row) {
                //Fill data using JSON to break model binding
                this.courseTableForm.task = JSON.parse(JSON.stringify(row));
            },
            //Course pagination
            handleSizeChange3(val) {
                //Reset page size
                this.pageSize2 = val;
                //Search again
                this.selectEmptyRoom();
            },
            handleCurrentChange3(val) {
                this.currentPage2 = val;
                //Search again
                this.selectEmptyRoom();
            },


        },


        //Data
        data() {
            return {
                //Pagination
                //Current page
                currentPage: 1,
                //Total pages
                totalCount: 0,
                //Current items
                pageSize: 5,
                //Loading
                loading: false,


                //Selected array
                selectIds: [],

                //Add visible
                addFormVisible: false,
                addFormVisible2: false,
                //Update visible
                updateFormVisible: false,
                searchForm: {
                    task: {
                        cclasses: {
                            course: {
                                courseName: '',
                            }
                        },
                        teacher: {
                            teacherName: '',
                        }
                    },
                    room: {
                        roomName: ''
                    },
                    timeslot: {
                        id: ''
                    },

                },

                oldName: '',
                //Add form
                courseTableForm: {
                    task: {
                        cclasses: {
                            course: {
                                courseName: ''
                            },
                            classesName: '',
                            size: '',
                        },
                        teacher: {
                            teacherName: ''
                        },
                        weekNode: ''
                    },
                    room: {
                        roomName: ''
                    },
                    timeslot: {}
                },

                //Selected values
                multipleSelection: [],

                //Table data
                tableData: [],


                //Assign course
                //Current page
                currentPage2: 1,
                //Total pages
                totalCount2: 0,
                //Current items
                pageSize2: 3,
                //Search form
                searchForm2: {
