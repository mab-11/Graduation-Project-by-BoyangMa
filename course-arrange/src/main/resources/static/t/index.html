<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College PE Scheduling System</title>
</head>
<body>


<el-container id="app" style="height:100% ;width: 100%">
    <el-header>
        <el-col :span="4" >
            <div id="nav_top_left" >
                <p style="color: #ffd04b;font-family: Arial;font-size: 20px">Scheduling System</p>
            </div>
        </el-col>
        <el-col :span="16">
            <el-menu :default-active="activeIndex1" class="el-menu-demo"
                     mode="horizontal" background-color="#464d53"
                     text-color="#fff"
                     active-text-color="#ffd04b"
            >
                <el-menu-item index="7" @click="changePage('../table')">View Schedule</el-menu-item>
                <el-menu-item index="8" @click="changePage('../EmptyRoom')">View Empty Room</el-menu-item>
            </el-menu>
        </el-col>

        <el-col :span="4">
            <div id="nav_top_right" >
                Welcome,{{teacher.id}}!
                <el-link :underline="false" @click="logout" style="margin-left:30px ;color: white">Logout</el-link>
            </div>
        </el-col>

    </el-header>

    <el-container style="height: 100%;" >
        <el-aside width="200px"  >
            <el-menu :default-active="activeIndex2" class="el-menu-demo"
                     style="height: 100%" background-color="#545c64"
                     text-color="#fff"
                     active-text-color="#ffd04b">
                <el-menu-item index="1" @click="changePage('teacher')">Basic Info Management</el-menu-item>
                <el-menu-item index="2" @click="changePage('courseTable')">Schedule Result Management</el-menu-item>
            </el-menu>
        </el-aside>
        <el-main>
            <iframe id="main" v-bind:src="mainPage" width="100%" height="100%" frameborder="0"></iframe>
        </el-main>
    </el-container>

</el-container>


<!--Import Resources-->
<script src="../js/vue.js"></script>
<script src="../element-ui/lib/index.js"></script>
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
<link rel="stylesheet" href="../css/index.css">
<script src="../js/axios-0.18.0.js"></script>

<script>


    //Create Vue core object
    new Vue({
        el: "#app",
        mounted() {
            //Get login status
            axios({
                method:"post",
                url:"http://localhost:8080/teacher/checkLogin",
            }).then(resp=>{
                this.teacher =resp.data;
            })
        },
        methods: {
            changePage(pageName){
                this.mainPage=  pageName +".html";
            },

            //Logout request
            logout(){
                axios({
                    method:"post",
                    url:"http://localhost:8080/user/logout"
                }).then(resp=>{
                    console.log(resp.data);
                    if (resp.data == "success"){
                        location.href="login.html"
                    }
                })
            }

        },
        data() {
            return {
                teacher:{
                    id:"",
                    teacherName:"",
                },
                mainPage:"teacher.html",
                activeIndex1: '',
                activeIndex2: '1',
            }
        }
    })

</script>

</body>
</html>
