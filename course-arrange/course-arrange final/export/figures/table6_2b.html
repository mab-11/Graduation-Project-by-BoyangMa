<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table 6.2b: Constraint Satisfaction Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: #070a14; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 50%), radial-gradient(ellipse at 85% 85%, rgba(255, 87, 34, 0.06) 0%, transparent 50%), linear-gradient(180deg, #070a14 0%, #0d1220 50%, #070a14 100%); z-index: 0; }
        .bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px); background-size: 40px 40px; }
        .container { position: relative; z-index: 1; max-width: 800px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: #00d4ff; text-shadow: 0 0 30px rgba(0, 212, 255, 0.5); letter-spacing: 4px; }
        .content-box { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(7, 10, 20, 0.95) 100%); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .table-title { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #00d4ff; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; }
        .data-table th { background: rgba(0, 212, 255, 0.15); color: #00d4ff; font-family: 'Orbitron', sans-serif; font-size: 11px; padding: 12px 8px; text-align: center; }
        .data-table td { background: rgba(0, 0, 0, 0.4); color: #c0c8d8; font-size: 13px; padding: 10px 8px; text-align: center; border-top: 1px solid rgba(0, 212, 255, 0.08); }
        .highlight { color: #00e676; font-weight: 600; }
        .footer { text-align: center; margin-top: 25px; color: #5a6a8a; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="header"><h1>TABLE 6.2b</h1></div>
        <div class="content-box">
            <div class="table-title">CONSTRAINT SATISFACTION COMPARISON</div>
            <table class="data-table">
                <thead><tr><th>Metric</th><th>Fixed GA</th><th>AMOGA</th><th>Improvement</th></tr></thead>
                <tbody>
                    <tr><td>Conflict Count</td><td>15</td><td class="highlight">2</td><td class="highlight">-86.7%</td></tr>
                    <tr><td>Penalty Value</td><td>125</td><td class="highlight">15</td><td class="highlight">-88.0%</td></tr>
                    <tr><td>Satisfaction Rate</td><td>92.4%</td><td class="highlight">99.5%</td><td class="highlight">+7.7%</td></tr>
                    <tr><td>Feasible Solutions</td><td>85%</td><td class="highlight">98%</td><td class="highlight">+15.3%</td></tr>
                </tbody>
            </table>
        </div>
        <div class="footer">Course Scheduling System</div>
    </div>
</body>
</html>
